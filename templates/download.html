<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file.original_name }} - Drop</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container container-download">
        <a href="/" class="logo logo-small">Drop!</a>

        <div class="download-card">
            <div class="file-icon-large">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                    <polyline points="13 2 13 9 20 9"></polyline>
                </svg>
            </div>
            
            <h1 class="file-name-large">{{ file.original_name }}</h1>
            <p class="file-meta">{{ file.human_size }} • {{ file.downloads }} downloads</p>

            <a href="/download/{{ file.code }}" class="btn-primary">Download</a>
         </div>
    </div>
</body>
</html>
